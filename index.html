<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR Property Card Demo</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; touch-action: none; }
    .overlay {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      text-align: center; padding: 10px; color: white;
      background: rgba(0,0,0,0.55); font-size: 14px; pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="overlay">Point at the card. Drag with 1 finger to rotate, pinch with 2 fingers to zoom.</div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    gesture-detector>

    <a-marker preset="hiro" id="front-marker">
      <a-entity id="front-model" position="0 0 0" scale="0.15 0.15 0.15" gesture-handler>
        <a-box position="0 1 0" width="1.2" height="2" depth="1.2" color="#8a94a3"></a-box>
        <a-box position="0 2.1 0" width="1.3" height="0.2" depth="1.3" color="#4a5568"></a-box>
        <a-entity id="windows-front"></a-entity>
        <a-text value="SAMPLE BUILDING" position="0 3.2 0" align="center" color="#222" scale="2 2 2"></a-text>
      </a-entity>
    </a-marker>

    <a-marker type="pattern" url="unit-marker.patt" id="back-marker">
      <a-entity id="back-model" position="0 0 0" scale="0.15 0.15 0.15" gesture-handler>
        <a-box position="0 0 0" width="2.4" height="0.05" depth="1.8" color="#d8c9a8"></a-box>
        <a-box position="-1.15 0.5 0" width="0.05" height="1" depth="1.8" color="#eee"></a-box>
        <a-box position="1.15 0.5 0" width="0.05" height="1" depth="1.8" color="#eee"></a-box>
        <a-box position="0 0.5 -0.87" width="2.4" height="1" depth="0.05" color="#eee"></a-box>
        <a-box position="-0.6 0.2 -0.4" width="0.8" height="0.35" depth="0.4" color="#8b6f4e"></a-box>
        <a-box position="0.6 0.15 0.4" width="0.5" height="0.3" depth="0.5" color="#5b7c99"></a-box>
        <a-text value="SAMPLE UNIT" position="0 1.6 0" align="center" color="#222" scale="2 2 2"></a-text>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // ---- gesture-detector: turns raw touch events into 1-finger / 2-finger gesture events ----
    AFRAME.registerComponent('gesture-detector', {
      schema: { element: { default: '' } },
      init: function () {
        this.targetElement = this.data.element && document.querySelector(this.data.element);
        if (!this.targetElement) this.targetElement = this.el;
        this.internalState = {};
        this.emitGestureEvent = this.emitGestureEvent.bind(this);
        this.targetElement.addEventListener('touchstart', this.emitGestureEvent);
        this.targetElement.addEventListener('touchend', this.emitGestureEvent);
        this.targetElement.addEventListener('touchmove', this.emitGestureEvent);
      },
      emitGestureEvent: function (event) {
        const state = this.internalState;
        const touches = event.touches;
        if (event.type === 'touchmove' && touches) {
          if (touches.length === 1 && state.startX !== undefined) {
            const dx = touches[0].pageX - state.startX;
            this.el.emit('onefingermove', { positionChange: { x: dx } });
            state.startX = touches[0].pageX;
          } else if (touches.length === 2 && state.startSpread !== undefined) {
            const spread = this.getSpread(touches);
            this.el.emit('twofingermove', { spreadChange: spread - state.startSpread });
            state.startSpread = spread;
          }
        } else if (event.type === 'touchstart') {
          if (touches.length === 1) { state.startX = touches[0].pageX; }
          else if (touches.length === 2) { state.startSpread = this.getSpread(touches); }
        } else if (event.type === 'touchend') {
          state.startX = undefined;
          state.startSpread = undefined;
        }
      },
      getSpread: function (touches) {
        const dx = touches[0].pageX - touches[1].pageX;
        const dy = touches[0].pageY - touches[1].pageY;
        return Math.sqrt(dx * dx + dy * dy);
      }
    });

    // ---- gesture-handler: applies rotate / scale to whichever entity it's attached to ----
    AFRAME.registerComponent('gesture-handler', {
      schema: { minScale: { default: 0.05 }, maxScale: { default: 0.4 } },
      init: function () {
        this.baseScale = this.el.object3D.scale.x;
        this.currentScale = this.baseScale;
        this.el.sceneEl.addEventListener('onefingermove', (e) => {
          this.el.object3D.rotation.y += e.detail.positionChange.x * 0.01;
        });
        this.el.sceneEl.addEventListener('twofingermove', (e) => {
          this.currentScale += e.detail.spreadChange * 0.0015;
          this.currentScale = Math.min(Math.max(this.currentScale, this.data.minScale), this.data.maxScale);
          this.el.object3D.scale.set(this.currentScale, this.currentScale, this.currentScale);
        });
      }
    });

    // build placeholder window grid for the front model
    const windows = document.querySelector('#windows-front');
    for (let row = 0; row < 4; row++) {
      for (let col = -1; col <= 1; col++) {
        const w = document.createElement('a-box');
        w.setAttribute('position', `${col*0.35} ${0.3 + row*0.4} 0.61`);
        w.setAttribute('width', 0.15);
        w.setAttribute('height', 0.2);
        w.setAttribute('depth', 0.02);
        w.setAttribute('color', '#cfe8ff');
        windows.appendChild(w);
      }
    }
  </script>
</body>
</html>
